name: Build Mac Agent

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Agent ID (UUID from server)'
        required: true
      agent_name:
        description: 'Agent display name'
        required: true
        default: 'Agente'
      server_url:
        description: 'Server URL (e.g. https://myserver.com:8000)'
        required: true
      api_token:
        description: 'API token for this agent'
        required: true
      networks:
        description: 'Networks to scan (JSON array, e.g. ["192.168.1.0/24"])'
        required: true
        default: '["192.168.1.0/24"]'
      discovery_seconds:
        description: 'Discovery interval in seconds'
        required: false
        default: '14400'
      counters_seconds:
        description: 'Counters interval in seconds'
        required: false
        default: '14400'
      supplies_seconds:
        description: 'Supplies interval in seconds'
        required: false
        default: '3600'
      alerts_seconds:
        description: 'Alerts interval in seconds'
        required: false
        default: '3600'
      attributes_seconds:
        description: 'Attributes interval in seconds'
        required: false
        default: '43200'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pysnmp pyinstaller

      - name: Generate agent.py from template
        run: python build_agent.py
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          AGENT_NAME: ${{ inputs.agent_name }}
          SERVER_URL: ${{ inputs.server_url }}
          API_TOKEN: ${{ inputs.api_token }}
          NETWORKS: ${{ inputs.networks }}
          DISCOVERY_SECONDS: ${{ inputs.discovery_seconds }}
          COUNTERS_SECONDS: ${{ inputs.counters_seconds }}
          SUPPLIES_SECONDS: ${{ inputs.supplies_seconds }}
          ALERTS_SECONDS: ${{ inputs.alerts_seconds }}
          ATTRIBUTES_SECONDS: ${{ inputs.attributes_seconds }}

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --console \
            --name "Agente_${{ inputs.agent_name }}" \
            --hidden-import pystray \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pysnmp.hlapi.v3arch.asyncio \
            --clean --log-level ERROR \
            agent.py

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Agente_${{ inputs.agent_name }}_macos
          path: dist/Agente_*
          retention-days: 30
